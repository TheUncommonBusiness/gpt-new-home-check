        retention: f("cf", "Deleted per its policy. Export right not found", "Replit deletes stored data under its retention policy after account deletion. Pro and Enterprise get 30 days to move content after termination. The Terms have no export clause.", "https://replit.com/commercial-agreement"),
        certs: f("ok", "SOC 2 Type II for Replit itself", "Replit says it holds SOC 2 Type II and is working toward ISO 27001. Nothing says this covers the app you build.", "https://replit.com/security"),
        hipaa: f("nf", "Not found", "No HIPAA or BAA statement was found on the pages read, and its Trust Center did not load. Replit's Terms say you are responsible for your app and for complying with applicable laws.", "https://replit.com/terms-of-service"),
        access: f("cf", "Password or invite-only needs Pro. Core has none", "Published apps can be Public, Password protected, Workspace only or Invite only, and access controls are for Pro and Enterprise. Builders: Core 5, Pro 15. An end-user login system: not found.", "https://docs.replit.com/build/publish-your-app"),
        where: f("ok", "US on Google Cloud. Sub-processor list is public", "Replit is hosted mainly in the United States on Google Cloud, with EU hosting for Enterprise. Its public sub-processor list names Anthropic, OpenAI, Google and others.", "https://replit.com/subprocessors"),
        plans: f("ok", "Core $20 ($18 annual), Pro $100 ($90 annual)", "Core: $20 toward models, up to 5 builders. Pro: $100 toward models, up to 15 builders and 50 viewers. Your app also pays for each AI answer.", "https://replit.com/pricing")
      }
    }
  ];

  var QUESTIONS = {
    who: { q: "Who uses your GPT?", opts: [["me", "Just me"], ["team", "My team"], ["clients", "My clients or the public"], ["own", "Clients, and I want to build and host my own app"]] },
    health: { q: "Does the bot handle health information?", opts: [["yes", "Yes"], ["no", "No"], ["unsure", "Not sure yet"]] },
    signin: { q: "Must outside users sign in or be limited to people you invite?", opts: [["yes", "Yes"], ["no", "No, anyone with the link is fine"]] },
    soc2: { q: "Must the vendor hold a SOC 2 Type 2 attestation?", opts: [["yes", "Yes"], ["no", "No"]] },
    voice: { q: "Should people be able to speak to the bot by voice?", opts: [["yes", "Yes"], ["no", "No"]] }
  };

  var ASK = {
    who: function (o, a) { return "Can " + (a.who === "me" ? "I use it alone" : a.who === "team" ? "my team use it" : a.who === "own" ? "I build and host it myself" : "my clients use it") + " on " + o.name + ", and on which plan?"; },
    health: function (o) { return "Will " + o.name + " sign a BAA for the plan I would use, and what does it cover?"; },
    signin: function (o) { return "How do outside users sign in to " + o.name + ", and on which plan?"; },
    soc2: function (o) { return "Can " + o.name + " share its SOC 2 Type 2 report and say what it covers?"; },
    voice: function (o) { return "Can people speak to a bot on " + o.name + " by voice, and on which plan?"; }
  };

  function stepsFor(a) {
    var s = ["who", "health"];
    if (a.who === "clients" || a.who === "own") s.push("signin");
    s.push("soc2", "voice");
    return s;
  }

  function gateFail(o, a) {
    var fails = [];
    var w = o.who[a.who];
    if (w && !w[0]) fails.push({ gate: "who", why: w[1] });
    if (a.health === "yes" || a.health === "unsure") {
      var h = o.fields.hipaa.s;
      if (h === "nf") fails.push({ gate: "health", why: "No BAA was found on its pages." });
    }
    if (a.signin === "yes" && !o.signin) fails.push({ gate: "signin", why: "Sign-in or invite-only access was not confirmed on its pages." });
    if (a.soc2 === "yes") {
      var c = o.fields.certs.s;
      if (c !== "ok") fails.push({ gate: "soc2", why: c === "cf" ? "SOC 2 is named without a scope." : "No SOC 2 attestation was found." });
    }
    if (a.voice === "yes" && !o.voice) fails.push({ gate: "voice", why: "Voice was not found on its pages." });
    return fails;
  }

  function run(a) {
    var res = OPTIONS.map(function (o) { return { o: o, fails: gateFail(o, a) }; });
    var survivors = res.filter(function (r) { return r.fails.length === 0; }).map(function (r) { return r.o; });
    survivors.sort(function (x, y) { return x.price - y.price || (x.name < y.name ? -1 : 1); });
    var dropped = res.filter(function (r) { return r.fails.length > 0; });
    var min = dropped.length ? Math.min.apply(null, dropped.map(function (r) { return r.fails.length; })) : 0;
    var closest = dropped.filter(function (r) { return r.fails.length === min; }).slice(0, 3).map(function (r) {
      return { o: r.o, fails: r.fails, asks: r.fails.map(function (x) { return ASK[x.gate](r.o, a); }) };
    });
    return { survivors: survivors, dropped: dropped, closest: closest, unsure: a.health === "unsure" };
  }

  return { CHECKED: CHECKED, FIELDS: FIELDS, OPTIONS: OPTIONS, QUESTIONS: QUESTIONS, stepsFor: stepsFor, run: run };
});

</script>
<script>
(function(){
var F=window.Finder,st={a:{},step:0,view:"q",sel:0};
var panel=document.getElementById("panel"),stepEl=document.getElementById("step"),acts=document.getElementById("acts");
var GL={ok:"✓",cf:"~",nf:"?"};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function glyph(s){return '<i class="g '+s+'" aria-hidden="true">'+GL[s]+'</i>'}
function label(s){return s==="ok"?"Confirmed":s==="cf"?"Partly stated or pages differ":"Not found"}
function btn(id,txt){return '<button class="lnk" id="'+id+'" type="button">'+txt+'</button>'}
function reset(){st.a={};st.step=0;st.view="q";st.sel=0;render()}
function pick(k,v){
  st.a[k]=v;
  if(k==="who"&&v!=="clients"&&v!=="own")delete st.a.signin;
  var steps=F.stepsFor(st.a);
  if(st.step<steps.length-1){st.step++;st.view="q"}else{st.view="r";st.sel=0}
  render();
}
function resultFor(){return F.run(st.a)}
function render(){
  var steps=F.stepsFor(st.a),h="",a="",s="";
  if(st.view==="q"){
    var k=steps[st.step],Q=F.QUESTIONS[k];
    s=st.step===0?"Question 1":"Question "+(st.step+1)+" of "+steps.length;
    a=(st.step>0?btn("back","Back"):"")+btn("reset","Start over");
    h='<h2 class="q">'+esc(Q.q)+'</h2><div class="opts">'+Q.opts.map(function(o){return '<button class="opt" type="button" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+(st.a[k]===o[0])+'">'+esc(o[1])+'</button>'}).join("")+'</div>';
  }else{
    var R=resultFor(),n=R.survivors.length;
    if(st.view==="why"){
      s=n?"Why the others are out":"What to ask in writing";
      a=btn("backr","Back")+btn("reset","Start over");
      if(n){
        h='<div class="list">'+R.dropped.map(function(r){return '<div class="li"><b>'+esc(r.o.tab)+'</b><span>'+esc(r.fails[0].why)+(r.fails.length>1?' (+'+(r.fails.length-1)+' more)':'')+'</span></div>'}).join("")+'</div>';
      }else{
        h='<div class="none">Closest by gates passed. Send these to the vendor and ask for the answer in writing.</div><div class="list">'+R.closest.map(function(c){return '<div class="li"><b>'+esc(c.o.tab)+'</b><span>'+esc(c.asks[0])+'</span></div>'}).join("")+'</div>';
      }
    }else if(n){
      var o=R.survivors[Math.min(st.sel,n-1)];
      s=n+" of "+F.OPTIONS.length+" options still fit";
      a=btn("why","Why not the others")+btn("reset","Start over");
      var keys=["training","ownership","certs","hipaa","access"];
      var notes=[];
      if(R.unsure)notes.push("Not sure about health information, so this treats it as yes.");
      if(st.a.signin==="yes"&&o.signin)notes.push("Sign-in: "+o.signin.plan+".");
      if(st.a.voice==="yes"&&o.voice)notes.push("Voice: "+o.voice.plan+".");
      h='<div class="pills" role="tablist" aria-label="Options that fit">'+R.survivors.map(function(x,i){return '<button class="pill" role="tab" type="button" data-i="'+i+'" aria-selected="'+(i===Math.min(st.sel,n-1))+'">'+esc(x.tab)+'</button>'}).join("")+'</div>'+
        '<div class="head"><div class="name">'+esc(o.name)+'</div><div class="start">'+esc(o.start)+'</div></div>'+
        '<div class="rows">'+keys.map(function(kk){var fl=o.fields[kk],fd=F.FIELDS.filter(function(x){return x.k===kk})[0];return '<div class="row">'+glyph(fl.s)+'<span class="k">'+esc(fd.label)+'</span><span class="v">'+esc(fl.short)+'</span></div>'}).join("")+'</div>'+
        (notes.length?'<div class="notes">'+esc(notes.join(" "))+'</div>':'');
    }else{
      s="No option fits all your answers";
      a=btn("why","What to ask")+btn("backq","Change answers")+btn("reset","Start over");
      h='<div class="none">None of the seven confirm everything you asked for on their own pages. A gap means the pages do not say, so change an answer or ask the vendor in writing.</div><div class="list">'+R.closest.map(function(c){return '<div class="li"><b>'+esc(c.o.tab)+'</b><span>'+esc(c.fails[0].why)+'</span></div>'}).join("")+'</div>';
    }
  }
  stepEl.textContent=s;acts.innerHTML=a;panel.innerHTML=h;
  bind();
  if(window.onFinderRender)window.onFinderRender(st);
}
function on(id,fn){var e=document.getElementById(id);if(e)e.addEventListener("click",fn)}
function bind(){
  on("reset",reset);
  on("back",function(){st.step=Math.max(0,st.step-1);st.view="q";render()});
  on("why",function(){st.view="why";render()});
  on("backr",function(){st.view="r";render()});
  on("backq",function(){st.view="q";st.step=0;render()});
  Array.prototype.forEach.call(panel.querySelectorAll(".opt"),function(b){b.addEventListener("click",function(){pick(b.getAttribute("data-k"),b.getAttribute("data-v"))})});
  Array.prototype.forEach.call(panel.querySelectorAll(".pill"),function(b,i){
    b.addEventListener("click",function(){st.sel=i;render()});
    b.addEventListener("keydown",function(e){var m=panel.querySelectorAll(".pill").length,n=i;if(e.key==="ArrowRight")n=(i+1)%m;else if(e.key==="ArrowLeft")n=(i+m-1)%m;else return;e.preventDefault();st.sel=n;render();panel.querySelectorAll(".pill")[n].focus()});
  });
}
window.FinderUI={reset:reset};
render();
})();
</script>
